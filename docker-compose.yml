services:
  mariadb:
    image: "mariadb:10.4"
    container_name: "mariadb"
    restart: always
    ports:
      - "3308:3306"
    environment:
      - MYSQL_DATABASE=reading_tracker
      - MYSQL_ROOT_PASSWORD=1111
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00

    volumes:
      - mariadb_data:/var/lib/mysql


volumes:
  mariadb_data: